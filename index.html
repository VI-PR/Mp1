<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marcelin Power</title>
<meta name="description" content="Bloc 1 v5 : séances, charges suggérées, échauffement, analyse série par série, minuteur, progrès.">
<meta name="theme-color" content="#0D1B30">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mad Dawg">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
/* Marcelin Power · carnet de séance : bandeau bleu nuit et filet rouge (logo Mad Dawg), cartes d'exercice empilées avec la couleur
   de la feuille sur le bord, cases JAUNES à remplir, suggestion VERTE, calcul GRIS, onglets en bas comme une appli iPhone. */
:root {
  --bg: #EEF1F6; --surface: #FFFFFF; --surface-2: #F5F7FA; --line: #D5DBE5; --line-2: #E6EAF0;
  --ink: #0D1B30; --ink-2: #3F4B63; --muted: #66718A;
  --navy: #0D1B30; --navy-2: #172A4A; --on-navy: #FFFFFF; --on-navy-2: #B9C6DC; --red: #C00000;
  --primary: #0D1B30; --on-primary: #FFFFFF; --focus: #2F6FE0;
  --field: #FFF2CC; --field-line: #E3C25A; --field-ink: #2E2500;
  --sugg: #E2EFDA; --sugg-line: #A9D18E; --sugg-ink: #176640;
  --calc: #ECEEF2; --calc-ink: #46516A;
  --ok: #1E7B34; --ok-bg: #E3F3E6; --warn: #8A5A00; --warn-bg: #FFF1CF; --bad: #B42318; --bad-bg: #FDE6E3;
  --info: #1F5FA8; --info-bg: #E5EFFB; --gold: #7A5600; --gold-bg: #FFF4C7;
  --cat-sq: #F4B183; --cat-bp: #9DC3E6; --cat-dl: #A9D18E; --cat-sh: #FFD966; --cat-ac: #C9CED6;
  --c-sq: #C2571A; --c-bp: #1F6FB5; --c-dl: #3E8A2A; --c-cg: #7B4FC0; --c-wt: #8A94A6; --c-av: #0D1B30;
  --grid: #E3E7EE; --shadow: 0 1px 2px rgba(13, 27, 48, .06), 0 4px 14px rgba(13, 27, 48, .06);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Arial, sans-serif;
  --font-display: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --tabbar-h: 58px; --sab: env(safe-area-inset-bottom, 0px); --sat: env(safe-area-inset-top, 0px);
  --gutter-l: max(16px, env(safe-area-inset-left, 0px)); --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #09111E; --surface: #111C2E; --surface-2: #17243A; --line: #2A3A56; --line-2: #1F2D46;
    --ink: #E8EDF5; --ink-2: #BAC4D6; --muted: #8C99B0;
    --navy: #0B1628; --navy-2: #13223D; --on-navy: #FFFFFF; --on-navy-2: #A9B7CF; --red: #E02424;
    --primary: #E8EDF5; --on-primary: #0D1B30; --focus: #7FAEF5;
    --field: #3A3214; --field-line: #8C7730; --field-ink: #FFF0C2;
    --sugg: #12301F; --sugg-line: #2E6B45; --sugg-ink: #92DBA9;
    --calc: #1A2538; --calc-ink: #BAC4D6;
    --ok: #74D18E; --ok-bg: #12301F; --warn: #F3C366; --warn-bg: #362A0E; --bad: #FF8F85; --bad-bg: #3D1613;
    --info: #8DB9F2; --info-bg: #11253F; --gold: #F5D06A; --gold-bg: #33290B;
    --cat-sq: #E39A68; --cat-bp: #7FAEDB; --cat-dl: #8FC174; --cat-sh: #E9C24E; --cat-ac: #6F7A8C;
    --c-sq: #D8733A; --c-bp: #4F92D4; --c-dl: #5EA84C; --c-cg: #9A7CDB; --c-wt: #7D8AA3; --c-av: #E8EDF5;
    --grid: #22314B; --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #09111E; --surface: #111C2E; --surface-2: #17243A; --line: #2A3A56; --line-2: #1F2D46;
  --ink: #E8EDF5; --ink-2: #BAC4D6; --muted: #8C99B0;
  --navy: #0B1628; --navy-2: #13223D; --on-navy: #FFFFFF; --on-navy-2: #A9B7CF; --red: #E02424;
  --primary: #E8EDF5; --on-primary: #0D1B30; --focus: #7FAEF5;
  --field: #3A3214; --field-line: #8C7730; --field-ink: #FFF0C2;
  --sugg: #12301F; --sugg-line: #2E6B45; --sugg-ink: #92DBA9;
  --calc: #1A2538; --calc-ink: #BAC4D6;
  --ok: #74D18E; --ok-bg: #12301F; --warn: #F3C366; --warn-bg: #362A0E; --bad: #FF8F85; --bad-bg: #3D1613;
  --info: #8DB9F2; --info-bg: #11253F; --gold: #F5D06A; --gold-bg: #33290B;
  --cat-sq: #E39A68; --cat-bp: #7FAEDB; --cat-dl: #8FC174; --cat-sh: #E9C24E; --cat-ac: #6F7A8C;
  --c-sq: #D8733A; --c-bp: #4F92D4; --c-dl: #5EA84C; --c-cg: #9A7CDB; --c-wt: #7D8AA3; --c-av: #E8EDF5;
  --grid: #22314B; --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 var(--font);
  -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none;
}
body.modal { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }
p { margin: 0; }
small, .small { font-size: 13px; }
.muted { color: var(--muted); }
.center { text-align: center; }
.n { text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- bandeau ---------- */
.top {
  position: sticky; top: 0; z-index: 20; background: var(--navy); color: var(--on-navy);
  padding: calc(8px + var(--sat)) var(--gutter-r) 8px var(--gutter-l);
  display: flex; align-items: center; gap: 10px; border-bottom: 3px solid var(--red);
}
.top .logo { width: 40px; height: 40px; flex: none; display: block; }
.brand { min-width: 0; flex: 1; display: flex; flex-direction: column; line-height: 1.1; }
.brand b { font: 800 17px/1.1 var(--font-display); letter-spacing: .06em; text-transform: uppercase; }
.brand span { font-size: 12px; color: var(--on-navy-2); letter-spacing: .02em; }
.pill {
  flex: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid rgba(255, 255, 255, .22);
  background: rgba(255, 255, 255, .08); color: var(--on-navy); border-radius: 999px; padding: 6px 10px; font-size: 12.5px; font-weight: 600;
}
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: #9AA6BA; }
.pill.ok .dot { background: #4ADE80; }
.pill.warn .dot { background: #FBBF24; }
.pill.bad { background: #7F1D1D; border-color: #F87171; }
.pill.bad .dot { background: #F87171; }

.update {
  display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap;
  background: var(--info-bg); color: var(--info); border-bottom: 1px solid var(--line);
  padding: 10px var(--gutter-r) 10px var(--gutter-l); font-size: 14px; font-weight: 600;
}

main {
  display: flex; flex-direction: column; gap: 12px; max-width: 720px; margin: 0 auto;
  padding: 12px var(--gutter-r) calc(var(--tabbar-h) + var(--sab) + 24px) var(--gutter-l);
}
body.has-timer main { padding-bottom: calc(var(--tabbar-h) + var(--sab) + 96px); }
.vt { font: 800 24px/1.15 var(--font-display); letter-spacing: -.01em; margin-top: 4px; }

/* ---------- semaine et jours ---------- */
.weekbar {
  display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px;
  background: var(--navy-2); color: var(--on-navy); border-radius: 16px; padding: 6px;
}
.weekbar.deload { background: #3D4A5E; }
.weekbar .nav {
  width: 44px; height: 44px; border-radius: 12px; border: 0; background: rgba(255, 255, 255, .1); color: var(--on-navy);
  font-size: 26px; line-height: 1; display: grid; place-items: center;
}
.weekbar .nav:disabled { opacity: .3; }
.weeksel { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 44px; }
.weeksel select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; cursor: pointer; }
.wk-main { font: 800 22px/1.1 var(--font-display); letter-spacing: .04em; }
.wk-sub { font-size: 12.5px; color: var(--on-navy-2); text-transform: uppercase; letter-spacing: .08em; }
.wk-main::after { content: " ▾"; font-size: 13px; color: var(--on-navy-2); }
.targets { font-size: 13px; color: var(--ink-2); text-align: center; }

.days { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.day {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 8px 2px 10px;
  border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.day b { font: 800 16px/1.1 var(--font-display); }
.day span { font-size: 11.5px; color: var(--muted); }
.day.opt { border-style: dashed; }
.day.on { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.day.on span { color: inherit; opacity: .75; }
.dd { position: absolute; bottom: 4px; width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid var(--muted); }
.dd.half { background: linear-gradient(90deg, var(--ok) 50%, transparent 50%); border-color: var(--ok); }
.dd.full { background: var(--ok); border-color: var(--ok); }
.day.on .dd { border-color: currentColor; }

.dayhead { display: flex; flex-direction: column; gap: 4px; padding-top: 2px; }
.dayhead h2 { font: 800 20px/1.2 var(--font-display); }
.dayhead p { font-size: 14px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: 12.5px; font-weight: 700; }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.banner { border-radius: 12px; padding: 10px 12px; font-size: 14px; border-left: 4px solid; }
.banner.info { background: var(--info-bg); color: var(--info); }
.banner.warn { background: var(--warn-bg); color: var(--warn); font-weight: 600; }
.tg.fat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; font-size: 14px; align-items: flex-start; }
.tg.fat input { margin-top: 1px; accent-color: var(--warn); }
.tg.fat.on { border-color: var(--warn); background: var(--warn-bg); color: var(--warn); }
.banner.bad { background: var(--bad-bg); color: var(--bad); font-weight: 600; }

/* ---------- cartes d'exercice ---------- */
.cards { display: flex; flex-direction: column; gap: 12px; }
.card {
  background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); border: 1px solid var(--line-2);
  border-left: 6px solid var(--cat-ac); padding: 12px 12px 12px 12px; display: flex; flex-direction: column; gap: 9px; min-width: 0;
  scroll-margin-top: calc(80px + var(--sat));
}
.card.c-sq { border-left-color: var(--cat-sq); }
.card.c-bp { border-left-color: var(--cat-bp); }
.card.c-dl { border-left-color: var(--cat-dl); }
.card.c-sh { border-left-color: var(--cat-sh); }
.card.c-ac { border-left-color: var(--cat-ac); }
.card.miss { box-shadow: 0 0 0 2px var(--bad); }
.ch { display: flex; align-items: flex-start; gap: 8px; }
.ch h3 { flex: 1; min-width: 0; font: 700 17px/1.25 var(--font-display); }
.ch h3 .sub { display: inline-block; font: 700 11px/1 var(--font); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 3px 5px; vertical-align: 2px; }
.presc { font-size: 14.5px; color: var(--ink-2); }
.presc b { color: var(--ink); font-size: 16px; font-variant-numeric: tabular-nums; }
.note-s, .tip, .coach, .failtag { font-size: 13.5px; }
.note-s { color: var(--info); }
.tip { color: var(--muted); }
.coach { background: var(--info-bg); color: var(--info); border-radius: 10px; padding: 8px 10px; font-weight: 600; }
.failtag { color: var(--bad); font-weight: 700; }

.sugg {
  display: grid; grid-template-columns: auto 1fr; align-items: baseline; column-gap: 8px; row-gap: 2px;
  background: var(--sugg); border: 1px solid var(--sugg-line); color: var(--sugg-ink); border-radius: 12px; padding: 8px 12px;
}
.sugg .lbl { grid-column: 1 / -1; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
.sugg b { font: 800 26px/1.1 var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.sugg .u { font-size: 14px; font-weight: 600; }
.sugg small { grid-column: 1 / -1; font-size: 13px; }
.sugg.t-choose, .sugg.t-empty, .sugg.t-inactive { background: var(--calc); border-color: var(--line); color: var(--calc-ink); }
.sugg.t-choose b, .sugg.t-inactive b { font-style: italic; font-size: 21px; }
.sugg.t-same { background: var(--warn-bg); border-color: var(--warn); color: var(--warn); }
.sugg.t-fail2 { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.last { font-size: 13px; color: var(--muted); }

.inputs { display: grid; grid-template-columns: 1.25fr 1fr 1fr; gap: 8px; }
.f { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.f > span { font-size: 11.5px; font-weight: 700; color: var(--ink-2); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.f input, .f select, .f textarea, .srow input, .srow select {
  width: 100%; min-width: 0; height: 48px; border-radius: 10px; border: 1.5px solid var(--field-line); background: var(--field); color: var(--field-ink);
  padding: 0 10px; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; -webkit-appearance: none; appearance: none;
}
.f select, .srow select {
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 15px) 21px, calc(100% - 10px) 21px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 24px;
}
.f input::placeholder, .f textarea::placeholder, .srow input::placeholder { color: var(--field-ink); opacity: .45; font-weight: 600; }
.f.note textarea { height: auto; min-height: 44px; padding: 10px; font-size: 16px; font-weight: 500; line-height: 1.35; resize: none; }
.f input:focus, .f select:focus, .f textarea:focus, .srow input:focus, .srow select:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 30%, transparent); }

/* série par série (gros mouvements) */
.srows { display: flex; flex-direction: column; gap: 6px; }
.shead, .srow { display: grid; grid-template-columns: 26px minmax(0, 1.3fr) minmax(0, .8fr) minmax(0, 1fr) 42px; gap: 6px; align-items: center; }
.shead span { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
.srow .sn { font: 800 14px/1 var(--font-display); color: var(--ink-2); background: none; border: 0; padding: 0; height: 48px; text-align: left; white-space: nowrap; }
.srow input, .srow select { padding: 0 8px; }
.srow select { padding-right: 20px; background-position: calc(100% - 13px) 21px, calc(100% - 8px) 21px; }
.srow .sinfo { grid-column: 2 / -1; font-size: 13px; line-height: 1.35; margin: -1px 0 4px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.sinfo:empty { display: none; }
.sinfo.ok { color: var(--ok); } .sinfo.warn { color: var(--warn); } .sinfo.bad { color: var(--bad); } .sinfo.info { color: var(--ink-2); }
.sinfo.warn, .sinfo.bad { font-weight: 600; }
.srow.stop input, .srow.stop select { opacity: .5; }
.srow.next .sn { color: var(--ink); }
.srow.next .sn::before { content: "▸"; color: var(--red); margin-right: 1px; }
/* saisie rapide : -5/+5 lbs et -1/+1 rep */
.qbar { display: flex; align-items: center; gap: 6px; }
.qbar button {
  flex: 1 1 0; min-width: 0; height: 40px; padding: 0 4px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
  font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; transition: background .1s;
}
.qbar button:active { background: var(--line); }
.qbar .qsep { flex: 0 0 1px; align-self: stretch; margin: 7px 1px; background: var(--line); }
.srow .qbar { grid-column: 2 / -1; }
.srow.act .sn { color: var(--ink); }
.bump { animation: bump .5s ease-out; }
@keyframes bump { from { box-shadow: 0 0 0 4px color-mix(in srgb, var(--focus) 55%, transparent); } to { box-shadow: 0 0 0 4px transparent; } }
.usesugg { background: var(--sugg); border-color: var(--sugg-line); color: var(--sugg-ink); min-height: 30px; padding: 4px 10px; }
.sfoot { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 34px; }
.sfoot .muted { min-width: 0; }
.w85 { display: flex; flex-direction: column; gap: 6px; background: var(--surface-2); border: 1px dashed var(--line); border-radius: 12px; padding: 8px 10px 10px; }

.sets { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.set {
  width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface-2); color: var(--ink-2);
  font: 800 16px/1 var(--font-display); display: grid; place-items: center; transition: background .15s, border-color .15s;
}
.set.on { background: var(--ok); border-color: var(--ok); color: #fff; }
.sets .mini { margin-left: auto; }
.calc { background: var(--calc); color: var(--calc-ink); border-radius: 10px; padding: 7px 10px; font-size: 14px; font-variant-numeric: tabular-nums; }
.calc b { color: var(--ink); font-size: 16px; }
.alerts { display: flex; flex-direction: column; gap: 6px; }
.alerts:empty { display: none; }
.al { border-radius: 10px; padding: 8px 10px; font-size: 14px; font-weight: 600; }
.al.ok { background: var(--ok-bg); color: var(--ok); }
.al.bad { background: var(--bad-bg); color: var(--bad); }
.al.warn { background: var(--warn-bg); color: var(--warn); }
.al.info { background: var(--info-bg); color: var(--info); font-weight: 500; }
.al.gold { background: var(--gold-bg); color: var(--gold); }

/* ---------- boutons ---------- */
.btn {
  min-height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 10px 14px; font-size: 15px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; text-align: center;
}
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn.bad { background: var(--bad); border-color: var(--bad); color: #fff; }
.mini {
  min-height: 34px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
  padding: 6px 12px; font-size: 13.5px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums;
}
.mini.ghost { background: transparent; }
.mini.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.ch .mini { flex: none; }
.btns, .dayfoot { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.dayfoot { grid-template-columns: 1fr 1fr; }
.dayfoot .btn:last-child { grid-column: 1 / -1; }

/* ---------- panneaux ---------- */
.panel { background: var(--surface); border: 1px solid var(--line-2); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.panel h3 { font: 800 17px/1.2 var(--font-display); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--line-2); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; position: relative; min-width: 0; }
.panel .tile { background: var(--surface-2); }
.tile .sw { position: absolute; top: 12px; right: 12px; }
.tl { font-size: 12px; font-weight: 700; color: var(--ink-2); text-transform: uppercase; letter-spacing: .06em; }
.tv { font: 800 28px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.tv small { font: 600 13px var(--font); color: var(--muted); }
.ts { font-size: 12.5px; color: var(--muted); }
.ts b.up { color: var(--ok); }
.ts b.down { color: var(--bad); }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 4px; background: var(--muted); flex: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.s-sq { --sc: var(--c-sq); } .s-bp { --sc: var(--c-bp); } .s-dl { --sc: var(--c-dl); } .s-cg { --sc: var(--c-cg); } .s-wt { --sc: var(--c-wt); } .s-av { --sc: var(--c-av); }
.sw[class*="s-"] { background: var(--sc); }

svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
svg.chart .grid { stroke: var(--grid); stroke-width: 1; }
svg.chart .ax { fill: var(--muted); font-size: 10px; font-family: var(--font); font-variant-numeric: tabular-nums; }
svg.chart .ln { fill: none; stroke: var(--sc); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
svg.chart .ln.s-wt { stroke: none; }
svg.chart .pt { fill: var(--sc); stroke: var(--surface); stroke-width: 2; }
svg.chart .end { fill: var(--ink); font-size: 10.5px; font-weight: 700; font-family: var(--font); font-variant-numeric: tabular-nums; }
svg.chart .cross { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
svg.chart .hit { fill: transparent; cursor: pointer; }
.panel .tblwrap { margin: 0 -2px; }
.empty { color: var(--muted); font-size: 14px; padding: 18px 0; text-align: center; }
.selbox { font-size: 13.5px; background: var(--surface-2); border-radius: 10px; padding: 8px 10px; font-variant-numeric: tabular-nums; }

.tblwrap { overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; }
table { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
table th, table td { padding: 6px 8px; border-bottom: 1px solid var(--line-2); text-align: center; white-space: nowrap; }
table thead th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
table tbody th { text-align: left; font-weight: 700; position: sticky; left: 0; background: var(--surface); }
table.grid-t td.bad { color: var(--bad); font-weight: 800; }
table.grid-t td.warn { color: var(--warn); font-weight: 800; }
table.grid-t td.small { font-size: 11.5px; color: var(--ink-2); }
td.z-okt { color: var(--ok); font-weight: 700; } td.z-warnt { color: var(--warn); font-weight: 700; } td.z-badt { color: var(--bad); font-weight: 700; }

/* poids */
.wform { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) auto; gap: 8px; align-items: end; }
.wform input[type="date"] { font-size: 16px; padding: 0 6px; }
.wform .btn { height: 48px; }
.wlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.wlist li { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 4px 10px; padding: 6px 0; border-bottom: 1px solid var(--line-2); font-size: 14.5px; }
.wlist li b { font-variant-numeric: tabular-nums; }
.wlist li small { grid-column: 1 / 2; color: var(--muted); font-size: 12.5px; margin-top: -4px; }
.tiles.two { grid-template-columns: 1fr 1fr; }

/* ---------- volume ---------- */
.vbars { display: flex; flex-direction: column; gap: 7px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 16px; padding: 12px; }
.vb { display: grid; grid-template-columns: 112px 1fr 30px; align-items: center; gap: 8px; font-size: 14px; }
.vm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vt2 { position: relative; height: 14px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.vt2 .band { position: absolute; top: 0; bottom: 0; left: 41.667%; width: 41.667%; background: color-mix(in srgb, var(--ok) 14%, transparent); border-left: 1px dashed var(--ok); border-right: 1px dashed var(--ok); }
.vt2 .bar { position: absolute; left: 0; top: 3px; bottom: 3px; border-radius: 0 4px 4px 0; z-index: 1; }
.bar.z-ok { background: var(--ok); } .bar.z-warn { background: var(--warn); } .bar.z-bad { background: var(--bad); }
.vn { text-align: right; font-variant-numeric: tabular-nums; }
.feel { border-top: 1px solid var(--line-2); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.fm { font-weight: 800; }
.fm small { font-weight: 500; color: var(--muted); }
.seg { display: flex; align-items: center; gap: 6px; }
.seg > span { width: 100px; font-size: 13.5px; color: var(--ink-2); }
.sg { width: 40px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font-weight: 800; font-variant-numeric: tabular-nums; }
.sg.on { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.seg.wide .sg { flex: 1; width: auto; height: 42px; }
.adv { font-size: 13.5px; border-radius: 10px; padding: 7px 10px; }
.adv.ok { background: var(--ok-bg); color: var(--ok); }
.adv.warn { background: var(--warn-bg); color: var(--warn); }

/* ---------- guide ---------- */
.gsec { background: var(--surface); border: 1px solid var(--line-2); border-radius: 14px; }
.panel .gsec { background: var(--surface-2); }
.gsec summary {
  list-style: none; cursor: pointer; padding: 13px 40px 13px 14px; font-weight: 800; position: relative; min-height: 48px; display: flex; align-items: center;
}
.gsec summary::-webkit-details-marker { display: none; }
.gsec summary::after { content: ""; position: absolute; right: 16px; top: 50%; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: translateY(-70%) rotate(45deg); transition: transform .15s; }
.gsec[open] summary::after { transform: translateY(-30%) rotate(-135deg); }
.gbody { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; font-size: 15px; min-width: 0; }
.gbody p, .gbody li { line-height: 1.5; }
.gbody ul, .gbody ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.gbody h4 { font: 800 15px/1.2 var(--font-display); margin-top: 4px; }
.gsec.danger summary { color: var(--bad); }
ol.rules li::marker { font-weight: 800; color: var(--red); }
table.rpe td:nth-child(2) { white-space: normal; text-align: left; min-width: 170px; }
ul.mob { list-style: none; padding: 0 !important; }
ul.mob li { display: grid; grid-template-columns: 100px 1fr; gap: 10px; align-items: start; padding: 6px 0; border-bottom: 1px solid var(--line-2); }
ul.mob img, ul.mob .noimg { width: 100px; height: 80px; border-radius: 10px; background: #fff; object-fit: contain; border: 1px solid var(--line-2); }
ul.mob div { display: flex; flex-direction: column; gap: 2px; font-size: 14px; min-width: 0; }
ul.mob .mm { font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* ---------- réglages ---------- */
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.wrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tg { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 15px; }
.tg input { width: 22px; height: 22px; accent-color: var(--ok); flex: none; }
.snaps { list-style: none; margin: 0; padding: 0 !important; }
.snaps li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line-2); }
.snaps li span { display: flex; flex-direction: column; font-weight: 700; font-size: 14px; }
.snaps li small { font-weight: 500; color: var(--muted); }
.filebtn { position: relative; overflow: hidden; cursor: pointer; }
.filebtn input { position: absolute; inset: 0; opacity: 0; font-size: 16px; cursor: pointer; }
textarea.big { width: 100%; min-height: 220px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); padding: 10px; font: 13px/1.4 ui-monospace, Menlo, monospace; }
.sheet .f textarea { height: auto; min-height: 90px; font-size: 14px; font-weight: 500; padding: 10px; }

/* ---------- échauffement / feuille du bas ---------- */
.scrim { position: fixed; inset: 0; background: rgba(5, 10, 20, .5); z-index: 40; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 90vh; max-height: 90dvh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); color: var(--ink); border-radius: 20px 20px 0 0; box-shadow: 0 -8px 30px rgba(0, 0, 0, .25);
}
.sheet-in {
  max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px;
  padding: 14px var(--gutter-r) calc(18px + var(--sab)) var(--gutter-l);
}
.sheet-h { display: flex; align-items: flex-start; gap: 10px; }
.sheet-h h2 { flex: 1; font: 800 19px/1.25 var(--font-display); }
.x { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); font-size: 16px; }
table.warm { width: 100%; font-size: 14.5px; }
table.warm td { white-space: normal; }
table.warm td:first-child { text-align: left; }
table.warm td:last-child { text-align: left; }
table.warm tr.top td { font-weight: 800; background: var(--sugg); color: var(--sugg-ink); }
table.warm tr.skip td { color: var(--muted); font-style: italic; }
.plate {
  display: inline-flex; align-items: center; justify-content: center; font-style: normal; font-weight: 800; font-size: 12px;
  border-radius: 5px; padding: 0 5px; margin: 2px 3px 2px 0; min-width: 26px; height: 24px; font-variant-numeric: tabular-nums;
  border: 1px solid rgba(0, 0, 0, .25);
}
.plate.p45 { background: #1F5FBF; color: #fff; height: 30px; }
.plate.p35 { background: #F2C230; color: #2A2000; height: 28px; }
.plate.p25 { background: #2E8B3E; color: #fff; height: 26px; }
.plate.p10 { background: #FFFFFF; color: #1A1A1A; height: 22px; }
.plate.p5 { background: #5B6475; color: #fff; height: 20px; }
.plate.p2_5 { background: #C3C9D3; color: #1A1A1A; height: 18px; font-size: 11px; }
.adj { border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; font-size: 14.5px; }
.adj.ok { background: var(--ok-bg); color: var(--ok); }
.adj.warn { background: var(--warn-bg); color: var(--warn); }
.adj.bad { background: var(--bad-bg); color: var(--bad); }
.adj .btn { align-self: stretch; }

/* ---------- minuteur ---------- */
.timer {
  position: fixed; left: 0; right: 0; bottom: calc(var(--tabbar-h) + var(--sab)); z-index: 30;
  background: var(--navy-2); color: var(--on-navy); border-top: 3px solid var(--ok); overflow: hidden;
}
.timer.over { border-top-color: var(--red); background: #5A0E0E; }
.tprog { position: absolute; left: 0; top: 0; height: 100%; width: 100%; background: rgba(255, 255, 255, .07); transform-origin: left; }
.tin { position: relative; max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding: 8px var(--gutter-r) 8px var(--gutter-l); }
.tt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.tl2 { font-size: 12px; color: var(--on-navy-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tt b { font: 800 26px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.tb { display: flex; gap: 6px; flex: none; }
.timer .mini { background: rgba(255, 255, 255, .12); border-color: rgba(255, 255, 255, .25); color: var(--on-navy); }

/* ---------- onglets ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 0 env(safe-area-inset-right, 0px) var(--sab) env(safe-area-inset-left, 0px);
}
.tabbar button {
  height: var(--tabbar-h); border: 0; background: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-size: 11px; font-weight: 700; letter-spacing: .02em;
}
.tabbar svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button.on { color: var(--ink); }
.tabbar button.on svg { stroke: var(--red); }

/* ---------- message ---------- */
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + var(--sab) + 14px); z-index: 50;
  max-width: min(92vw, 520px); background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 14px; font-size: 14.5px; font-weight: 600;
  box-shadow: 0 6px 24px rgba(0, 0, 0, .3); text-align: center;
}
body.has-timer .toast { bottom: calc(var(--tabbar-h) + var(--sab) + 84px); }

@media (min-width: 560px) {
  .vb { grid-template-columns: 150px 1fr 34px; }
}
@media (max-width: 360px) {
  .inputs { grid-template-columns: 1fr 1fr; }
  .inputs .f:first-child { grid-column: 1 / -1; }
  .qbar { gap: 4px; }
  .qbar button { font-size: 13px; padding: 0 2px; }
  .brand span { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}

/* repères de couleur dans le guide (mêmes couleurs que la feuille) */
.k-yel, .k-grn, .k-gry { border-radius: 6px; padding: 0 6px; border: 1px solid; }
.k-yel { background: var(--field); color: var(--field-ink); border-color: var(--field-line); }
.k-grn { background: var(--sugg); color: var(--sugg-ink); border-color: var(--sugg-line); }
.k-gry { background: var(--calc); color: var(--calc-ink); border-color: var(--line); }
/* échauffement : vitesse de la série à 85 % (rapide / normale / lente) */
.w85l { font-size: 11.5px; font-weight: 700; color: var(--ink-2); text-transform: uppercase; letter-spacing: .06em; }
.speed { display: flex; gap: 6px; }
.speed .spd { flex: 1 1 0; min-width: 0; height: 44px; padding: 0 4px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 15px; font-weight: 700; }
.speed .spd.on { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
table.warm tr.opt td { color: var(--ink-2); }

</style>

  function lineChart(series, opts) {
    var Wd = 340, Ht = 190, pl = 40, pr = 54, pt = 12, pb = 26;
    var all = []; series.forEach(function (s) { s.pts.forEach(function (v) { if (v !== null) all.push(v); }); });
    if (!all.length) return '<p class="empty">Le graphique apparaît dès qu’un top set est noté.</p>';
    var lo = Math.min.apply(null, all), hi = Math.max.apply(null, all);
    var step = opts.step || 25; lo = Math.floor((lo - step * 0.4) / step) * step; hi = Math.ceil((hi + step * 0.4) / step) * step; if (hi === lo) hi = lo + step;
    var n = opts.labels.length;
    var x = function (i) { return pl + (n === 1 ? 0 : i * (Wd - pl - pr) / (n - 1)); };
    var y = function (v) { return pt + (hi - v) * (Ht - pt - pb) / (hi - lo); };
    var g = '';
    var ticks = []; var tickStep = step; while ((hi - lo) / tickStep > 5) tickStep *= 2;
    for (var v = Math.ceil(lo / tickStep) * tickStep; v <= hi; v += tickStep) ticks.push(v);
    ticks.forEach(function (v) { g += '<line class="grid" x1="' + pl + '" x2="' + (Wd - pr) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text class="ax" x="' + (pl - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '</text>'; });
    opts.labels.forEach(function (lab, i) { if (opts.showLabel(i)) g += '<text class="ax" x="' + x(i) + '" y="' + (Ht - 6) + '" text-anchor="middle">' + lab + '</text>'; });
    var ends = [];
    series.forEach(function (s) {
      var d = '', started = false, last = null;
      s.pts.forEach(function (v, i) { if (v === null) { started = false; return; } d += (started ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1); started = true; last = [i, v]; });
      g += '<path class="ln s-' + s.color + '" d="' + d + '"/>';
      s.pts.forEach(function (v, i) { if (v !== null) g += '<circle class="pt s-' + s.color + '" cx="' + x(i) + '" cy="' + y(v) + '" r="4"/>'; });
      if (last && (!opts.labelOnly || opts.labelOnly.indexOf(s.color) >= 0)) ends.push({ y: y(last[1]), x: x(last[0]), txt: s.name + ' ' + last[1], c: s.color });
    });
    ends.sort(function (a, b) { return a.y - b.y; });
    for (var k = 1; k < ends.length; k++) if (ends[k].y - ends[k - 1].y < 12) ends[k].y = ends[k - 1].y + 12;
    ends.forEach(function (e) { g += '<text class="end" x="' + (e.x + 7) + '" y="' + (e.y + 4) + '">' + h(e.txt.split(' ').pop()) + '</text>'; });
    if (opts.sel !== null && opts.sel !== undefined) g += '<line class="cross" x1="' + x(opts.sel) + '" x2="' + x(opts.sel) + '" y1="' + pt + '" y2="' + (Ht - pb) + '"/>';
    // zones de toucher (une par semaine)
    for (var i2 = 0; i2 < n; i2++) { var x0 = i2 === 0 ? pl - 10 : (x(i2 - 1) + x(i2)) / 2, x1 = i2 === n - 1 ? Wd - pr + 10 : (x(i2) + x(i2 + 1)) / 2; g += '<rect class="hit" data-act="' + opts.act + '" data-i="' + i2 + '" x="' + x0 + '" y="0" width="' + (x1 - x0) + '" height="' + Ht + '"/>'; }
    return '<svg class="chart" viewBox="0 0 ' + Wd + ' ' + Ht + '" role="img" aria-label="' + h(opts.title) + '">' + g + '</svg>';
  }

      try {
        navigator.share({ title: title, text: text }).then(function () { toast('Bilan envoyé.'); }, function (err) {
          if (err && err.name === 'AbortError') return;
          copy(text, okMsg);
        });
        return;
      } catch (e) { /* on copie */ }
    }
    copy(text, okMsg);
  }
  function copy(text, okMsg) {
    var ok = function () { toast(okMsg || 'Copié.'); };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(ok, function () { showText('Texte à copier', text); }); return; }
    } catch (e) {}
    showText('Texte à copier', text);
  }

  // ---------- service worker (appli installée) ----------
  function registerSW() {
    if (BUILD !== 'pwa' || !('serviceWorker' in navigator)) return;
    try {
      navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(function (reg) {
        swReg = reg;
        if (reg.waiting && navigator.serviceWorker.controller) showUpdate();
        reg.addEventListener('updatefound', function () {
          var nw = reg.installing; if (!nw) return;
          nw.addEventListener('statechange', function () { if (nw.state === 'installed' && navigator.serviceWorker.controller) showUpdate(); });
        });
      }, function () {});
      // 1re installation : le service worker prend la main sans recharger ; mise à jour : on recharge une seule fois
      var hadCtl = !!navigator.serviceWorker.controller, reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!hadCtl) { hadCtl = true; return; }
        if (reloaded) return; reloaded = true; S.flush(); location.reload();
      });
    } catch (e) {}
  }
  function showUpdate() {
    var u = document.getElementById('update'); if (!u) return;
    u.hidden = false;
    u.innerHTML = '<span>Nouvelle version de l’appli prête. Tes données restent.</span><button class="mini primary" data-act="doupdate">Mettre à jour</button>';
  }

  // ---------- événements ----------
  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]'); if (!el) return;
    var act = el.getAttribute('data-act'), card = el.closest('.card'), id = card ? card.getAttribute('data-ex') : null, w = state.ui.week;
    switch (act) {
      case 'tab': break;
      case 'week': {
        var nw = Math.max(0, Math.min(P.weeks.length - 1, w + parseInt(el.getAttribute('data-d'), 10)));
        state.ui.week = nw; commit({ noCompute: true }); render(); window.scrollTo(0, 0); break;
      }
      case 'day': state.ui.day = el.getAttribute('data-day'); commit({ noCompute: true }); render(); window.scrollTo(0, 0); break;
      case 'set': {
        var e = entry(w, id, true), i = parseInt(el.getAttribute('data-i'), 10), ex = P.byId[id];
        e.done = Array.isArray(e.done) ? e.done : [];
        e.done[i] = !e.done[i];
        if (!e.at) e.at = today();
        commit({ noCompute: true });
        el.classList.toggle('on', !!e.done[i]); el.textContent = (e.done[i] || el.closest('.srow')) ? '✓' : String(i + 1); el.setAttribute('aria-pressed', e.done[i] ? 'true' : 'false');
        if (e.done[i]) startTimer(ex, restFor(ex));
        if (el.closest('.srow') && e.done[i]) { delete qRow[w + ':' + id]; refreshCards(); }
        break;
      }
      case 'rest': startTimer(P.byId[id], restFor(P.byId[id])); break;
      case 'q': quick(el, card, id, w); break;
      case 'qsel': if (card) { qRow[w + ':' + id] = parseInt(el.getAttribute('data-i'), 10); showQ(card, qRow[w + ':' + id]); } break;
      case 'tadd': if (state.timer) { state.timer.end += parseInt(el.getAttribute('data-v'), 10) * 1000; state.timer.rang = (state.timer.end - Date.now()) <= 0; if (state.timer.end - Date.now() > 0 && state.settings.wake) requestWake(); S.save(state); renderTimer(); } break;
      case 'tstop': stopTimer(); break;
      case 'warm': openWarm(id); break;
      case 'speed': {
        var sid = el.getAttribute('data-id') || sheetId, sv = el.getAttribute('data-v');
        if (!sid) break;
        state.warm[w] = state.warm[w] || {}; var ss = state.warm[w][sid] = state.warm[w][sid] || {};
        if (ss.speed85 === sv) delete ss.speed85; else ss.speed85 = sv;
        commit({ noCompute: true });
        syncSpeed(document, w, sid);
        if (sheetKind === 'warm' && sheetId === sid) renderWarm(sid);
        refreshCards();
        break;
      }
      case 'usesugg': {
        var ex4 = P.byId[id], i4 = parseInt(el.getAttribute('data-i'), 10), e4 = entry(w, id, true);
        e4.sets = Array.isArray(e4.sets) ? e4.sets : [];
        e4.sets[i4] = e4.sets[i4] || {}; e4.sets[i4].c = el.getAttribute('data-v');
        if (!e4.at) e4.at = today();
        deriveRow(w, ex4, e4); commit();
        var inp4 = card.querySelector('[data-sf="c"][data-i="' + i4 + '"]'); if (inp4) inp4.value = e4.sets[i4].c;
        qRow[w + ':' + id] = i4;               // la saisie rapide reste sur cette série (reps sans clavier)
        refreshCards();
        break;
      }
      case 'useadj': {
        var tid = el.getAttribute('data-id') || sheetId, v = el.getAttribute('data-v'), b0 = el.getAttribute('data-base'), e2 = entry(w, tid, true);
        state.warm[w] = state.warm[w] || {}; var wsx = state.warm[w][tid] = state.warm[w][tid] || {};
        if (b0 && num(wsx.load) === null) wsx.load = b0;      // la charge prévue reste la base : pas de 2e baisse
        e2.charge = v; if (!e2.at) e2.at = today(); commit(); if (sheetKind) closeSheet(); render();
        var inp = document.getElementById('in-' + w + '-' + tid + '-charge'); if (inp) inp.scrollIntoView({ block: 'center' });
        toast('Top set ajusté : ' + v + ' lbs.'); break;
      }
      case 'close': closeSheet(); break;
      case 'goguide': state.ui.tab = 'guide'; state.ui.guide = el.getAttribute('data-sec'); commit({ noCompute: true }); render(); var g = document.getElementById('g-' + state.ui.guide); if (g) g.scrollIntoView({ block: 'start' }); break;
      case 'bilan': shareText('Bilan ' + wk(w).label, bilanText(w), 'Bilan de ' + wk(w).label + ' copié : colle-le dans ta conversation avec Claude.'); break;
      case 'export': exportJson(); break;
      case 'csv': deliver('marcelin-power-seances-' + today() + '.csv', csvText(), 'text/csv', 'Tableau CSV exporté.'); break;
      case 'import': openImport(); break;
      case 'imptext': previewImport(document.getElementById('imptext').value || ''); break;
      case 'impgo': doImport(); break;
      case 'copytext': { var ta = document.getElementById('sharetext'); copy(ta.value, 'Copié.'); try { ta.select(); } catch (e) {} break; }
      case 'restsnap': {
        var key = el.getAttribute('data-k');
        S._idbGet(key).then(function (txt) {
          var d = S.parse(txt); if (!d) { toast('Copie illisible.'); return; }
          pendingImport = d; openImport(); previewImport(txt);
        });
        break;
      }
      case 'reset1': {
        var z = document.getElementById('resetzone');
        z.innerHTML = '<p class="al bad">Sûr ? Toutes tes séances et pesées de ce téléphone seront effacées.</p><button class="btn bad" data-act="reset2">Oui, tout effacer</button>';
        break;
      }
      case 'reset2': {
        var before = JSON.parse(JSON.stringify(state));
        S.snapshot('effacement', before).then(function () {
          var f = fresh(); f.log = {}; f.weights = []; f.settings = before.settings; f.rev = (before.rev || 0) + 1; f.ui = { tab: 'reglages', week: 0, day: 'j1' };
          state = f; S.save(state); R = E.compute(P, state.log); render(); toast('Tout est effacé. Une copie est gardée dans Copies automatiques.', 6000);
        });
        break;
      }
      case 'theme': state.settings.theme = el.getAttribute('data-v'); commit({ noCompute: true }); applyTheme(); render(); break;
      case 'feel': {
        var m = el.getAttribute('data-m'), k = el.getAttribute('data-k'), val = parseInt(el.getAttribute('data-v'), 10);
        state.feel[w] = state.feel[w] || {}; state.feel[w][m] = state.feel[w][m] || {};
        if (state.feel[w][m][k] === val) delete state.feel[w][m][k]; else state.feel[w][m][k] = val;
        commit({ noCompute: true }); var y = window.scrollY; render(); window.scrollTo(0, y); break;
      }
      case 'e1sel': { var si = parseInt(el.getAttribute('data-i'), 10); state.ui.e1sel = state.ui.e1sel === si ? null : si; var y2 = window.scrollY; render(); window.scrollTo(0, y2); break; }
      case 'delw': {
        var dd = el.getAttribute('data-d'), wv = el.getAttribute('data-w'), idx = -1;
        state.weights.forEach(function (x, i) { if (idx < 0 && x.d === dd && String(num(x.w)) === wv) idx = i; });
        if (idx >= 0) { state.weights.splice(idx, 1); commit({ noCompute: true }); var y3 = window.scrollY; render(); window.scrollTo(0, y3); toast('Pesée effacée.'); }
        break;
      }
      case 'doupdate': {
        S.flush();
        if (swReg && swReg.waiting) swReg.waiting.postMessage('skipWaiting'); else location.reload();
        break;
      }
    }
  });
  document.querySelector('.tabbar').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-tab]'); if (!b) return;
    state.ui.tab = b.getAttribute('data-tab'); commit({ noCompute: true }); render(); window.scrollTo(0, 0);
  });
  document.getElementById('savepill').addEventListener('click', function () { state.ui.tab = 'reglages'; commit({ noCompute: true }); render(); window.scrollTo(0, 0); });
  document.getElementById('scrim').addEventListener('click', closeSheet);
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && sheetKind) closeSheet(); });

  function onField(ev) {
    var t = ev.target;
    if (t.matches('[data-fatigue]') && ev.type !== 'change') return;
    if (t.matches('[data-sf]')) {
      var cs = t.closest('.card'); if (!cs) return;
      var ids = cs.getAttribute('data-ex'), ws0 = state.ui.week, exs = P.byId[ids], es = entry(ws0, ids, true), fs = t.getAttribute('data-sf'), is = parseInt(t.getAttribute('data-i'), 10);
      es.sets = Array.isArray(es.sets) ? es.sets : [];
      es.sets[is] = es.sets[is] || {};
      if (es.sets[is][fs] === t.value) return;
      es.sets[is][fs] = t.value;
      if (!es.at && t.value) es.at = today();
      deriveRow(ws0, exs, es); commit();
      var sv = es.sets[is];
      es.done = Array.isArray(es.done) ? es.done : [];
      if (fs === 'p' && t.value && sv.c && sv.r && !es.done[is]) {        // RPE noté = série validée
        es.done[is] = true; commit({ noCompute: true });
        var bt = cs.querySelector('.srow[data-i="' + is + '"] .set');
        if (bt) { bt.classList.add('on'); bt.setAttribute('aria-pressed', 'true'); }
        delete qRow[ws0 + ':' + ids];
        refreshCards(); startTimer(exs, restFor(exs));
        return;
      }
      refreshCards();
      return;
    }
    if (t.matches('[data-fatigue]')) {
      var wf = state.ui.week, kf = wf + ':' + state.ui.day;
      state.fatigue = state.fatigue || {};
      if (t.checked) state.fatigue[kf] = true; else delete state.fatigue[kf];
      commit({ noCompute: true }); var yf = window.scrollY; render(); window.scrollTo(0, yf);
      toast(t.checked ? 'Jour de fatigue : bas de la fourchette partout.' : 'Jour normal.');
      return;
    }
    if (t.matches('[data-f]')) {
      var card = t.closest('.card'); if (!card) return;
      var id = card.getAttribute('data-ex'), w = state.ui.week, e = entry(w, id, true), f = t.getAttribute('data-f');
      if (e[f] === t.value) return;
      e[f] = t.value;
      if (!e.at && hasData(e)) e.at = today();
      if (f === 'notes') { commit({ noCompute: true }); autoGrow(t); return; }
      commit(); refreshCards();
      return;
    }
    if (t.matches('[data-w]')) {
      var w2 = state.ui.week; state.warm[w2] = state.warm[w2] || {}; var ws = state.warm[w2][sheetId] = state.warm[w2][sheetId] || {};
      if (ws[t.getAttribute('data-w')] === t.value) return;
      ws[t.getAttribute('data-w')] = t.value; commit({ noCompute: true }); renderWarm(sheetId); return;
    }
    if (t.matches('[data-set]')) {
      var k = t.getAttribute('data-set'), s = state.settings;
      if (t.type === 'checkbox') s[k] = t.checked;
      else if (k === 'bar' || k === 'trapBar') { var v = num(t.value); if (v !== null && v > 0) s[k] = v; }
      else s[k] = parseInt(t.value, 10);
      commit({ noCompute: true }); return;
    }
    if (t.id === 'weeksel' && ev.type === 'change') {
      state.ui.week = parseInt(t.value, 10); commit({ noCompute: true }); render(); window.scrollTo(0, 0); return;
    }
    if (t.id === 'impfile' && ev.type === 'change') {
      var file = t.files && t.files[0]; if (!file) return;
      var rd = new FileReader();
      rd.onload = function () { previewImport(String(rd.result || '')); };
      rd.onerror = function () { document.getElementById('impout').innerHTML = '<p class="al bad">Impossible de lire ce fichier.</p>'; };
      rd.readAsText(file);
    }
  }
  document.addEventListener('input', onField);
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.matches('select[data-f], select[data-sf], select[data-w], select[data-set], input[type=checkbox][data-set], #weeksel, #impfile')) onField(ev);
    if (t.matches('input[type=checkbox][data-fatigue]')) onField(ev);
    if (t.matches('[data-f], [data-sf]')) { var cr = t.closest('.card'); if (cr) checkRecord(state.ui.week, P.byId[cr.getAttribute('data-ex')]); }
  });
  document.addEventListener('submit', function (ev) {
    var f = ev.target; if (f.getAttribute('data-form') !== 'weight') return;
    ev.preventDefault();
    var d = document.getElementById('wdate').value || today(), v = num(document.getElementById('wval').value);
    if (v === null || v < 50 || v > 600) { toast('Écris ton poids en lbs, par exemple 215 ou 214,6.'); return; }
    state.weights.push({ d: d, w: String(v) });
    commit({ noCompute: true }); var y = window.scrollY; render(); window.scrollTo(0, y); toast('Pesée ajoutée : ' + frNum(v, v % 1 ? 1 : 0) + ' lbs.');
  });
  function autoGrow(t) { t.style.height = 'auto'; t.style.height = Math.min(220, t.scrollHeight + 2) + 'px'; }
  document.addEventListener('focusin', function (ev) {
    var t = ev.target;
    if (t.matches('textarea[data-f]')) autoGrow(t);
    if (t.matches('[data-sf]')) {
      var c = t.closest('.card'), i = parseInt(t.getAttribute('data-i'), 10); if (!c) return;
      var key = state.ui.week + ':' + c.getAttribute('data-ex');
      if (qRow[key] !== i) { qRow[key] = i; showQ(c, i); }
    }
  });
  document.addEventListener('pointerdown', unlockAudio, { once: true, passive: true });

  // accès pour les tests automatiques
  window.MP_APP = { get state() { return state; }, get R() { return R; }, bilanText: bilanText, csvText: csvText, render: render };
  boot();
})();

</script>
